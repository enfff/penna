[workspace]
resolver = "2"
members = [
 "core",
 "adapters/git",
 "adapters/fs",
 "adapters/markdown",
 "engine",
]

# Single source of truth for the version of every crate in the workspace.
# Bump here only (or via scripts/bump-version.sh). All members inherit this
# value, so a workspace bump publishes a consistent set across the board.
#
# `repository`, `homepage`, `keywords`, `categories`, and `rust-version`
# are publication metadata inherited by every member crate, including the
# ones that get published to crates.io (penna-core, penna-adapters-git,
# penna-engine).
[workspace.package]
version = "0.3.0"
edition = "2024"
license = "GPL-3.0-or-later"
repository = "https://github.com/enfff/penna"
homepage = "https://github.com/enfff/penna"
rust-version = "1.88"
keywords = ["journal", "journaling", "markdown", "local-first", "notes"]
categories = ["text-processing", "development-tools"]
