[package]
name = "penna-adapters-markdown"
version.workspace = true
edition.workspace = true
description = "Markdown adapter for Penna journaling engine"
license.workspace = true
# Not part of the published engine dependency graph. Set to true (and add
# the metadata inherited by the other crates) before publishing it standalone.
publish = false

[dependencies]
penna-core = { version = "0.2.1", path = "../../core" }
serde = { version = "1", features = ["derive"] }
serde_yaml = "0.9"
serde_json = "1"
